kernel: gemm
# 注：morpher_benchmarks/gemm/gemm.c 的 DFG pass 会 OOM（dfggenPass.cpp:2266），
# 改用 woset_benchmarks/gemm_1（同算法，带 please_map_me，供 DFG 生成使用）。
c_source: toolchain/vendor/dfggen/benchmarks/woset_benchmarks/gemm_1/gemm.c
function: gemm
xdim: 4
ydim: 4
numberofbanks: 2
banksize: 2048
dfg_type: PartPred
init_ii: 4
max_ii: 8
ii_ladder: [4, 5, 6, 8]
mapper_timeout_s: 600
kernel_walltime_s: 1200
max_rounds: 4
max_llm_calls: 12
