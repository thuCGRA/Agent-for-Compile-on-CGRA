# acc-thu / evo：用伐谋（Famou 2.0）演化 CGRA 映射算法
#
# 用法（在 ~/acc-thu 下）：
#   ~/miniconda3/envs/famou/bin/python ~/famou-v2/run_famou.py \
#       -c evo/config.yaml -p evo/init.py -e evo/evaluator.py
#
# 与 examples/circle_packing 的区别：这里的适应度不是浮点误差，而是
# "一份放置能不能在 4x4 HyCUBE 上合法且少绕路"，评一次约 50 ms（纯 Python）。

experiment:
  name: cgra_mapper_evolution
  task_description: |
    # CGRA 映射算法的演化任务

    ## 背景
    我们要为一个 4x4 的 CGRA（HyCUBE 结构）写映射器。输入是一个数据流图（DFG）——
    编译器前端（LLVM pass）把 C 循环体变成了若干算子和它们之间的依赖边。
    你的任务是写一个函数，决定**每个算子放在哪个 PE 上、在什么相位执行**。

    硬件结构：
    - 阵列 4x4 = 16 个 PE，坐标 (x, y)，x 从 0 到 3，y 从 0 到 3。
    - **x=0 那一列的 4 个 PE 是 PE_MEM**（访存 PE），它们连着片上存储（SPM）。
    - x=1..3 的 12 个 PE 是算术 PE（ALU），只能做算术。
    - 相邻 PE 之间有四个方向的连线（N/E/S/W），一次传输走一条边算 1 跳。
    - 每个 PE 每个相位（cycle）只能执行 1 个算子。
    - 相位是模 II 的：PE 在周期 c 执行，等价于在周期 c+II、c+2II……执行。

    ## 你要实现的接口
    ```python
    def place(prob, ii):
        '''返回 {node_idx: (x, y, t)}'''
    ```
    `prob` 是一个 dict，字段如下（全部是内建类型，可直接 pickle）：

    | 键 | 含义 |
    |---|---|
    | `kernel` | 内核名（字符串，仅供调试） |
    | `ii` | 本次要求的启动间隔（与参数 `ii` 相同） |
    | `xdim`, `ydim` | 阵列尺寸，这里是 4 和 4 |
    | `pe_mem` | 访存 PE 的坐标列表，如 `[[0,0],[0,1],[0,2],[0,3]]` |
    | `pe_alu` | 算术 PE 的坐标列表（12 个） |
    | `nodes` | 节点列表，每个是 `{"idx","op","parents","children","const","var","is_mem","lat"}` |
    | `edges` | 边列表，每个是 `[parent_idx, child_idx, nextiter]` |
    | `alu_ops`, `mem_ops` | 算子名 → 延迟（ALU 的多数是 1，访存是 2） |
    | `var_bank` | 变量名 → bank 编号（`is_mem` 节点的 `var` 落在这个 bank 上） |
    | `bank_vars` | bank 编号 → 该 bank 里的变量名 |
    | `n_nodes`, `op_hist`, `res_min_ii` | 规模与算子直方图，资源下界 |

    `is_mem=True` 的节点（LOAD/LOADB/LOADH/LOADCL/STORE/STOREB/STOREH）
    必须放在 `pe_mem` 上；其余节点必须放在 `pe_alu` 上。

    ## 硬约束（违反任意一条，该内核得 0 分）
    1. 每个节点恰好一个位置，不能漏也不能重复；
    2. 同一个 `(x, y, t)` 不能放两个节点；
    3. `0 <= x < xdim`，`0 <= y < ydim`，`0 <= t < ii`；
    4. 访存算子只能在 `pe_mem` 上，算术算子只能在 `pe_alu` 上；
    5. SELECT / CMERGE 有两个操作数，它们的两个父边必须落在**不同**的相位上
       （一个在 `t`，另一个在 `t-1`），否则功能单元拿不到两个操作数。

    ## 相位与跳数的关系（决定了分数）
    一条边 `p -> c` 的跳数 `h` 必须满足同余式
    ```
    h ≡ (到达相位 - t_p - lat_p)  (mod ii),   h >= |x_p-x_c| + |y_p-y_c|
    ```
    也就是说：父节点在第 `t_p` 拍算出结果，经过 `lat_p` 拍延迟和 `h` 跳传输，
    必须在子节点执行的那一拍（或 SELECT 的 `t_c-1` 那一拍）到达。
    **多出来的跳数 `h - 曼哈顿距离` 叫绕路，绕路越少越好。**

    ## 打分
    每个内核在两个 II 上评测：II=4（基线，必须做到）和 II=3（更难，冲刺目标）。
    ```
    score_kernel = 0.6 / (1 + cost_ii4 / 20) + 0.4 / (1 + cost_ii3 / 20)   # 只有合法才计分
    combined_score = mean(score_kernel over 3 kernels)
    ```
    `cost = 绕路总跳数 + 3 x 端口超额`（同一 PE 同一拍进入超过 4 条边算超额）。
    所以 `combined_score` 的上界是 1.0，基线程序大约 0.60。

    ## 优化建议
    - 有依赖的节点尽量放相邻（曼哈顿距离小），依赖链沿一行或一列铺开；
    - 访存节点按 `var_bank` 放到对应 bank 那一行的 PE_MEM 上（`bank 0` → y=0 行等），
      这样访存边不会横跨整列；
    - 相位是模 II 的，`t` 只在 `[0, ii)` 里，不要试图用大 t 去躲冲突；
    - SELECT/CMERGE 的两个父节点相位要错开 1，这通常需要让两个父节点距离不同
      或者 `t` 不同；
    - II=3 时相位槽位只有 3 个，比 II=4 紧得多，注意别让同一 PE 在同一相位挤爆。

    ## 三个评测内核
    `array_add`（20 节点，访存密集）、`mac`（22 节点，含 SELECT 归约）、
    `trmm`（11 节点，含 OLOAD/OSTORE）。程序必须对三者都成立，不要针对某一个特化。

  language: python
  strategy: greedy
  max_iterations: 2
  max_workers: 2
  checkpoint_interval: 5
  seed: 42

  island:
    num_islands: 4
    island_size: 50
    migration_interval: 10
    migration_size: 2
    migration_topology: ring
    reset_interval: 40
    reset_size: 2

  debug:
    enabled: true
    max_iterations: 2

infrastructure:
  llm:
    provider: openai
    api_base: https://your-endpoint.example.com/v1
    model: your-model-name
    api_key: sk-replace-me
    temperature: 0.8
    max_tokens: 32768
    timeout: 3600
    stream: true

  storage:
    type: local
    base_path: ./famou_data

  logger:
    type: local
    level: INFO
    file_enabled: true

  env:
    type: local
    timeout: 300

  monitor:
    enabled: false
    type: wandb

  langfuse:
    enabled: false
    public_key: none
    secret_key: none
    base_url: https://us.cloud.langfuse.com
